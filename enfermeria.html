<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Lista de Pacientes de Enfermería · SIGESAPOL</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700&display=swap">
<link rel="stylesheet" href="css/hemodialisis.css?v=3.47">
</head>
<body data-pagina="enf">
<div class="top">
  <img class="logo" src="img/logo-sigesapol.png" alt="Sistema de Gestión de Salud Policial SIGESAPOL">
  <span>SETUP ▾</span><span>Consulta Externa ▾</span><span>Hemodiálisis ▾</span><a class="top-ef on" href="enfermeria.html">Enfermería (EF) ▾</a><span>[USUARIO] ▾</span>
  <span class="rol">Ver como:
    <select id="selRol">
      <option value="nef">Nefrólogo (turno día)</option>
      <option value="enf" selected>Enfermería de Hemodiálisis (turno día)</option>
      <option value="adm">Admisión de Hemodiálisis</option>
      <option value="tec">Técnico de citas (Hemodiálisis)</option>
    </select>
  </span>
  <span class="rt">Hospital Nacional PNP Luis N. Sáenz</span>
</div>

<div class="wrap">
  <div class="side" id="side"></div>
  <div class="main">
    <h1>HOSPITAL NACIONAL PNP LUIS N. SAENZ<br>DEPARTAMENTO DE ENFERMERÍA · MÓDULO DE ENFERMERÍA (EF)</h1>

    <div class="bar"><span class="ce">CE</span>LISTA DE PACIENTES DE ENFERMERÍA - CONSULTA EXTERNA</div>
    <div class="box">
      <form id="formEnf">
        <div class="row">
          <div class="f"><label for="eDes">Fecha Desde</label><input class="in" id="eDes" value="06/07/2026"></div>
          <div class="f"><label for="eHas">Fecha Hasta</label><input class="in" id="eHas" value="30/11/2026"></div>
          <div class="f"><label for="eDoc">Nro. Documento</label><input class="in" id="eDoc" inputmode="numeric" placeholder="BUSCAR ..."></div>
          <div class="f"><label for="eSer">SERVICIO</label><select class="in" id="eSer"><option>NEFROLOGÍA</option><option>CARDIOLOGÍA</option><option>TODOS</option></select></div>
        </div>
        <div class="row">
          <div class="f"><label for="eEst">Estado</label><select class="in" id="eEst"><option value="REG">REGISTRADOS</option><option value="PEN">PENDIENTES</option></select></div>
          <div class="f"><label>&nbsp;</label><button type="button" class="btn g" style="width:100%" id="eExp">⎙ EXPORTAR</button></div>
          <div class="f"><label>&nbsp;</label><button type="submit" class="btn k" style="width:100%">🔍 BUSCAR</button></div>
          <div class="f"><label>&nbsp;</label><button type="button" class="btn" style="width:100%;background:var(--verde-osc)" id="eNuevo">⊞ NUEVO</button></div>
        </div>
      </form>
      <div class="tw"><table id="tablaEnf"></table></div>
      <div class="leg" id="contEnf"></div>
    </div>
  </div>
</div>
<div class="velo" id="velo"><div class="modal lg" id="enfDet" role="dialog" aria-modal="true" aria-labelledby="edTit"></div></div>
<div class="aviso" id="aviso" role="status"></div>
<script src="js/hemodialisis.js?v=3.47"></script>
</body>
</html>
